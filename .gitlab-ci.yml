image: ghcr.io/astral-sh/uv:python3.10-bookworm

stages:
  - quality
  - test
  - build
  - package
  - docs
  - complete
  - release

variables:
  UV_CACHE_DIR: .uv-cache

cache:
  key:
    files:
      - uv.lock
  paths:
    - .uv-cache/

before_script:
  - uv sync --locked --all-packages --group dev

ruff:
  stage: quality
  script:
    - uv run ruff check .

pyright:
  stage: quality
  script:
    - uv run pyright

tests:python3.10:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.10-bookworm
  script:
    - uv run pytest tests -m "not slow and not acceptance and not packaging and not package_tools and not complete and not wetlands and not public_data and not external_binary and not sairpico_binary and not model_runtime"

tests:python3.11:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.11-bookworm
  script:
    - uv run pytest tests -m "compat and not slow and not acceptance and not packaging and not package_tools and not complete and not wetlands and not public_data and not external_binary and not sairpico_binary and not model_runtime"

tests:python3.12:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.12-bookworm
  script:
    - uv run pytest tests -m "not slow and not acceptance and not packaging and not package_tools and not complete and not wetlands and not public_data and not external_binary and not sairpico_binary and not model_runtime"

tests:acceptance:
  stage: test
  script:
    - uv run pytest -m "acceptance and not complete"

tests:package-tools:
  stage: test
  script:
    - uv run pytest -m "package_tools and not complete"

build:
  stage: build
  script:
    - uv build --all-packages --out-dir dist/packages
  artifacts:
    when: always
    paths:
      - dist/packages/

package-artifacts:
  stage: package
  needs:
    - job: build
      artifacts: true
  script:
    - BIOIMAGEFLOW_PACKAGE_ARTIFACTS_DIR=dist/packages uv run pytest tests/unit/test_package_artifacts.py

docs:
  stage: docs
  script:
    - uv run sphinx-build -W --keep-going docs/source docs/_build/html
  artifacts:
    when: always
    paths:
      - docs/_build/html/

.complete-test-job:
  stage: complete
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: on_success
    - when: manual

.release-validation-job:
  stage: complete
  image: ghcr.io/astral-sh/uv:python3.11-bookworm
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: on_success
    - when: manual

release-python3.11-deterministic:
  extends: .release-validation-job
  script:
    - uv run pytest tests -m "not slow and not acceptance and not packaging and not package_tools and not complete and not wetlands and not public_data and not external_binary and not sairpico_binary and not model_runtime"
    - uv run pytest -m "acceptance and not complete"
    - uv run pytest -m "package_tools and not complete"
    - uv run pytest tests/unit/test_package_artifacts.py

complete-wetlands:
  extends: .complete-test-job
  script:
    - uv run pytest -m "complete and wetlands" --run-complete -rsx

complete-public-data:
  extends: .complete-test-job
  variables:
    BIOIMAGEFLOW_ALLOW_PUBLIC_DOWNLOADS: "1"
  script:
    - uv run pytest -m "complete and public_data" --run-complete -rsx

complete-external-binaries:
  extends: .complete-test-job
  script:
    - uv run pytest -m "complete and external_binary" --run-complete -rsx

complete-model-runtimes:
  extends: .complete-test-job
  script:
    - uv run pytest -m "complete and model_runtime" --run-complete -rsx

release:pypi:
  stage: release
  image: ghcr.io/astral-sh/uv:python3.11-bookworm
  resource_group: pypi
  variables:
    GIT_DEPTH: "0"
  environment:
    name: pypi
  rules:
    - if: '$CI_COMMIT_TAG =~ /^bioimageflow(?:-[a-z0-9]+)*-v\d+\.\d+\.\d+$/'
      when: manual
    - when: never
  script:
    - test -n "${UV_PUBLISH_TOKEN:-}"
    - RELEASE_PACKAGE="$(uv run python scripts/check_package_release.py "$CI_COMMIT_TAG" --field package)"
    - uv run pytest tests -m "not slow and not acceptance and not packaging and not package_tools and not complete and not wetlands and not public_data and not external_binary and not sairpico_binary and not model_runtime"
    - uv run pytest -m "acceptance and not complete"
    - uv run pytest -m "package_tools and not complete"
    - uv build --package "$RELEASE_PACKAGE" --no-sources --clear --out-dir dist/release
    - BIOIMAGEFLOW_PACKAGE_ARTIFACTS_DIR=dist/release BIOIMAGEFLOW_PACKAGE_ARTIFACTS_PACKAGE="$RELEASE_PACKAGE" uv run pytest tests/unit/test_package_artifacts.py
    - uv run python scripts/check_package_release.py "$CI_COMMIT_TAG" --artifacts-dir dist/release
    - uv publish --trusted-publishing never --check-url https://pypi.org/simple dist/release/*

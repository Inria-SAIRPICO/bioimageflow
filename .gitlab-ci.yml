image: ghcr.io/astral-sh/uv:python3.10-bookworm

stages:
  - quality
  - test
  - build
  - docs

variables:
  UV_CACHE_DIR: .uv-cache

cache:
  key:
    files:
      - uv.lock
  paths:
    - .uv-cache/

before_script:
  - uv sync --locked --all-packages --group dev

ruff:
  stage: quality
  script:
    - uv run ruff check .

pyright:
  stage: quality
  script:
    - uv run pyright

tests:
  stage: test
  script:
    - uv run pytest -m "not slow"

package-artifacts:
  stage: build
  script:
    - uv run pytest tests/unit/test_package_artifacts.py

build:
  stage: build
  script:
    - uv build --all-packages --out-dir dist/packages
  artifacts:
    when: always
    paths:
      - dist/packages/

docs:
  stage: docs
  script:
    - uv run sphinx-build -W --keep-going docs/source docs/_build/html
  artifacts:
    when: always
    paths:
      - docs/_build/html/

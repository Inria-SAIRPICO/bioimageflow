[project]
name = "bioimageflow-workspace"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = [
    "bioimageflow-core==0.1.6",
]

[dependency-groups]
dev = [
    "bioimageflow",
    "bioimageflow-common-tools",
    "bioimageflow-io-tools",
    "bioimageflow-measurement-tools",
    "bioimageflow-segmentation-tools",
    "bioimageflow-sairpico-tools",
    "bioimageflow-restoration-tools",
    "bioimageflow-spot-tools",
    "bioimageflow-tracking-tools",
    "furo>=2025.12.19",
    "imageio",
    "numpy",
    "packaging",
    "pytest",
    "tifffile",
    "sphinx>=8.1.3",
    "sphinx-autobuild>=2024.10.3",
    "sphinx-autodoc-typehints>=3.0.1",
    "sphinx-copybutton>=0.5.2",
    "myst-parser>=4.0.0",
    "tomli; python_version < '3.11'",
    "ruff>=0.15.7",
    "pyright>=1.1.410",
    "pyyaml>=6.0.3",
    "scikit-image",
    "ipython>=8.38.0",
    "wetlands",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
bioimageflow = { workspace = true }
bioimageflow-common-tools = { workspace = true }
bioimageflow-core = { workspace = true }
bioimageflow-io-tools = { workspace = true }
bioimageflow-measurement-tools = { workspace = true }
bioimageflow-segmentation-tools = { workspace = true }
bioimageflow-sairpico-tools = { workspace = true }
bioimageflow-restoration-tools = { workspace = true }
bioimageflow-spot-tools = { workspace = true }
bioimageflow-tracking-tools = { workspace = true }
wetlands = { path = "/Users/amasson/Travail/wetlands", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests", "packages"]
python_files = ["test_*.py"]
addopts = ["--strict-config", "--strict-markers"]
filterwarnings = []
markers = [
    "wetlands: tests that execute real Wetlands worker processes",
    "slow: deterministic or external tests excluded from the fast development loop",
    "acceptance: deterministic high-level workflow or example coverage excluded from the fast development loop",
    "packaging: build artifact, wheel, sdist, or package metadata artifact checks",
    "complete: optional complete tests that may use real binaries, public data, model runtimes, or longer workflows",
    "public_data: tests that download or use public datasets",
    "external_binary: tests that require non-Python command-line tools",
    "sairpico_binary: tests that require real SAIRPICO command-line tools",
    "model_runtime: tests that require optional model runtimes or model downloads",
    "package_tools: tests owned by optional tool packages",
    "shared_memory: deterministic tests requiring POSIX/shared-memory platform support",
    "compat: deterministic Python-version compatibility smoke coverage",
]

[tool.ruff]
target-version = "py310"
extend-exclude = [
    ".worktrees",
    "build",
    "dist",
    "docs/build",
    "docs/_build",
    "wetlands",
    "bif",
    "results",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

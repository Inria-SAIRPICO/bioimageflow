[project]
name = "bioimageflow-workspace"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "bioimageflow",
    "bioimageflow-common-tools",
    "furo>=2025.12.19",
    "imageio",
    "numpy",
    "pytest",
    "tifffile",
    "sphinx>=8.1.3",
    "sphinx-autobuild>=2024.10.3",
    "sphinx-autodoc-typehints>=3.0.1",
    "sphinx-copybutton>=0.5.2",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
bioimageflow = { workspace = true }
bioimageflow-core = { workspace = true }
bioimageflow-common-tools = { workspace = true }

workflow: live_cell_tracking
outputs:
  terminal_node: migration_metrics
  required_columns:
    - track_id
    - track_length
    - duration
    - start_frame
    - end_frame
    - path_length
    - net_displacement
    - net_speed
    - mean_step_speed
    - mean_area
    - track_count
    - mean_track_length
    - gap_count
    - duplicate_track_frame_count
    - object_assignment_conflict_count
    - short_track_fraction
  required_nodes:
    - objects
    - nearest_neighbor_tracks
    - migration_metrics_by_track
    - tracking_quality
    - quality_fields
    - migration_metrics
  forbidden_columns:
    - parent_track_id
    - division_time
  deterministic_acceptance:
    linker: nearest_neighbor
    min_rows: 1

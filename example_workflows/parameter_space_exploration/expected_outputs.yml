workflow: parameter_space_exploration
outputs:
  terminal_node: parameter_results
  required_columns:
    - path
    - sensitivity
    - size
    - output_image
    - mosaic_path
    - image_count
    - label_count
    - object_pixel_count
    - foreground_fraction
  upstream_columns:
    - path
    - sensitivity
    - size
    - output_image
  required_nodes:
    - input_images
    - sensitivity_values
    - size_values
    - parameter_grid
    - extract_marker_channel
    - atlas_detections
    - spot_mask_counts
    - results_mosaic
    - parameter_results
  deterministic_acceptance:
    row_count_formula: n_images * n_param_combinations
    default_param_combinations: 6

[project]
name = "bioimageflow-common-tools"
version = "0.1.5"
description = "Common bioimage analysis tools for BioImageFlow"
requires-python = ">=3.10"
dependencies = [
    "bioimageflow-core>=0.1.4",
    "bioimageflow>=0.1.4",
    "imageio",
    "numpy",
    "pandas",
    "pillow",
]

[tool.uv.sources]
bioimageflow-core = { workspace = true }
bioimageflow = { workspace = true }

[tool.hatch.build.targets.wheel.force-include]
"bioimageflow_common_tools/data/blobs.txt" = "bioimageflow_common_tools/data/blobs.txt"

[tool.hatch.build.targets.sdist.force-include]
"bioimageflow_common_tools/data/blobs.txt" = "bioimageflow_common_tools/data/blobs.txt"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

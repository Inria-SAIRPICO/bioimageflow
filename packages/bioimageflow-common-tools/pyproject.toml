[project]
name = "bioimageflow-common-tools"
version = "0.1.2"
description = "Common bioimage analysis tools for BioImageFlow"
requires-python = ">=3.10"
dependencies = ["bioimageflow-core", "bioimageflow"]

[tool.uv.sources]
bioimageflow-core = { workspace = true }
bioimageflow = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

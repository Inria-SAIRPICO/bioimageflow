[project]
name = "bioimageflow"
version = "0.1.1"
description = "Python library for orchestrating bioimage analysis workflows"
requires-python = ">=3.10"
dependencies = [
    "bioimageflow-core",
    "pandas",
    "pyarrow",
    "pydantic",
    "wetlands>=1.0.1",
]

[tool.uv.sources]
bioimageflow-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

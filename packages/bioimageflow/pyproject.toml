[project]
name = "bioimageflow"
version = "0.4.0"
description = "Python library for orchestrating bioimage analysis workflows"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "BioImageFlow Contributors" }]
license = "BSD-4-Clause"
license-files = ["LICENSE"]
keywords = ["bioimage-analysis", "bioimageflow", "microscopy", "workflow"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "bioimageflow-core>=0.2.1,<0.3",
    "numpy>=1.23.5",
    "pandas>=2.0.0",
    "pyarrow>=12.0.0",
    "pydantic>=2.0.0",
    "wetlands>=2.0.0,<3",
]

[project.scripts]
bioimageflow = "bioimageflow.cli:main"
bioimageflow-cluster-agent = "bioimageflow.launcher.cluster_agent:main"

[project.optional-dependencies]
parsl = ["parsl>=2026.5.25,<2026.6"]
psij = ["psij-python>=0.9.11,<0.10"]

[project.urls]
Homepage = "https://github.com/Inria-SAIRPICO/bioimageflow"
Documentation = "https://bioimageflow.readthedocs.io/latest/"
Repository = "https://github.com/Inria-SAIRPICO/bioimageflow"
Issues = "https://github.com/Inria-SAIRPICO/bioimageflow/issues"

[tool.uv.sources]
bioimageflow-core = { workspace = true }

[tool.hatch.build]
exclude = [
    "/.DS_Store",
    "/.gitignore",
    "/.mypy_cache/",
    "/.pytest_cache/",
    "/.ruff_cache/",
    "/.vscode/",
    "/__pycache__/",
    "/build/",
    "/dist/",
]

[tool.hatch.build.targets.sdist]
exclude = [
    ".DS_Store",
    ".gitignore",
    ".mypy_cache/",
    ".pytest_cache/",
    ".ruff_cache/",
    ".vscode/",
    "__pycache__/",
    "build/",
    "dist/",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

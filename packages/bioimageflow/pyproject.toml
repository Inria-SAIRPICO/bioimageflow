[project]
name = "bioimageflow"
version = "0.1.6"
description = "Python library for orchestrating bioimage analysis workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bioimageflow-core>=0.1.6",
    "numpy",
    "pandas",
    "pyarrow",
    "pydantic",
    "wetlands>=1.1.0",
]

[tool.uv.sources]
bioimageflow-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bioimageflow-sairpico-tools"
version = "0.1.0"
description = "SAIRPICO command-line tool wrappers for BioImageFlow"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["bioimageflow-core>=0.1.4", "bioimageflow>=0.1.4"]

[tool.uv.sources]
bioimageflow-core = { workspace = true }
bioimageflow = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

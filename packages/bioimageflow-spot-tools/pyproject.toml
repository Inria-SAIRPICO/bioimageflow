[project]
name = "bioimageflow-spot-tools"
version = "0.1.6"
description = "Spot detection and puncta quantification tools for BioImageFlow"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bioimageflow-core>=0.1.6",
    "bioimageflow>=0.1.6",
    "imageio",
    "numpy",
    "pandas",
]

[tool.uv.sources]
bioimageflow-core = { workspace = true }
bioimageflow = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

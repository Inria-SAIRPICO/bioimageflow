name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
  UV_LINK_MODE: copy

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.10"
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.9"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install workspace
        run: uv sync --locked --all-packages --group dev
      - name: Ruff
        run: uv run ruff check .
      - name: Pyright
        run: uv run pyright

  fast-tests:
    name: Fast tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            selector: not slow and not acceptance and not packaging and not package_tools and not complete and not wetlands and not public_data and not external_binary and not sairpico_binary and not model_runtime
          - python: "3.11"
            selector: compat and not slow and not acceptance and not packaging and not package_tools and not complete and not wetlands and not public_data and not external_binary and not sairpico_binary and not model_runtime
          - python: "3.12"
            selector: not slow and not acceptance and not packaging and not package_tools and not complete and not wetlands and not public_data and not external_binary and not sairpico_binary and not model_runtime
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.9"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install workspace
        run: uv sync --locked --all-packages --group dev
      - name: Run fast tests
        run: uv run pytest tests -m "${{ matrix.selector }}"

  deterministic-tests:
    name: Deterministic acceptance and package tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UV_PYTHON: "3.10"
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.9"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install workspace
        run: uv sync --locked --all-packages --group dev
      - name: Run acceptance tests
        run: uv run pytest -m "acceptance and not complete"
      - name: Run package-tool tests
        run: uv run pytest -m "package_tools and not complete"

  packages:
    name: Build and validate packages
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UV_PYTHON: "3.10"
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.9"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install workspace
        run: uv sync --locked --all-packages --group dev
      - name: Validate package metadata
        run: uv run pytest tests/unit/test_package_artifacts.py
      - name: Build all packages without workspace sources
        run: uv build --all-packages --no-sources --out-dir dist/packages
      - name: Validate built artifacts
        env:
          BIOIMAGEFLOW_PACKAGE_ARTIFACTS_DIR: dist/packages
        run: uv run pytest tests/unit/test_package_artifacts.py
      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: |
            dist/packages/*.whl
            dist/packages/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.10"
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.9"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install workspace
        run: uv sync --locked --all-packages --group dev
      - name: Check generated documentation
        run: uv run python docs/generate_tool_package_docs.py --check
      - name: Build documentation
        run: uv run sphinx-build -W --keep-going docs/source docs/_build/html
      - name: Upload documentation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentation
          path: docs/_build/html
          if-no-files-found: error
          retention-days: 7

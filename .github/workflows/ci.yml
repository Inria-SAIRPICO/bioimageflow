name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      core_floor_only:
        description: Run only the installed Core OS and Python floor capabilities
        type: boolean
        required: false
        default: false
      candidate_run_id:
        description: Successful ordinary CI run at this commit containing the canonical packages artifact
        type: string
        required: false
        default: ""
      candidate_core_sha256:
        description: Held SHA256 of the canonical Core wheel (requires candidate_run_id)
        type: string
        required: false
        default: ""

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
  UV_LINK_MODE: copy
  LOCAL_LIBRARY_PYTEST_ARGS: --ignore=tests/unit/parsl --ignore=tests/unit/cluster --ignore=tests/unit/launcher --ignore=tests/integration/parsl --ignore=tests/integration/launcher --ignore=tests/unit/test_distributed_contract.py

jobs:
  quality:
    if: github.event_name != 'workflow_dispatch' || !inputs.core_floor_only
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.10"
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.9"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install workspace
        run: uv sync --locked --all-packages --group dev
      - name: Ruff
        run: uv run ruff check .
      - name: Development guardrails
        run: |
          uv run python scripts/check_file_sizes.py
          uv run python scripts/check_import_boundaries.py
          uv run pytest tests/unit/test_development_workflow.py
      - name: Pyright
        run: uv run pyright

  unit-tests:
    if: github.event_name != 'workflow_dispatch' || !inputs.core_floor_only
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.9"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install workspace
        run: uv sync --locked --all-packages --group dev
      - name: Run unit tests
        run: uv run pytest tests/unit $LOCAL_LIBRARY_PYTEST_ARGS -m "not slow and not acceptance and not packaging and not package_tools and not complete and not wetlands and not public_data and not external_binary and not sairpico_binary and not model_runtime and not parsl"

  integration-tests:
    if: github.event_name != 'workflow_dispatch' || !inputs.core_floor_only
    name: Direct integration tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.9"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install workspace
        run: uv sync --locked --all-packages --group dev
      - name: Run direct integration tests
        run: uv run pytest tests/integration $LOCAL_LIBRARY_PYTEST_ARGS -m "not slow and not acceptance and not packaging and not package_tools and not complete and not wetlands and not public_data and not external_binary and not sairpico_binary and not model_runtime and not parsl"

  compatibility-tests:
    if: github.event_name != 'workflow_dispatch' || !inputs.core_floor_only
    name: Compatibility smoke (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.11"
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.9"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install workspace
        run: uv sync --locked --all-packages --group dev
      - name: Run compatibility smoke tests
        run: uv run pytest tests $LOCAL_LIBRARY_PYTEST_ARGS -m "compat and not slow and not acceptance and not packaging and not package_tools and not complete and not wetlands and not public_data and not external_binary and not sairpico_binary and not model_runtime and not parsl"

  core-python314-tests:
    if: github.event_name != 'workflow_dispatch' || !inputs.core_floor_only
    name: Core IOModel (Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.9"
      - name: Run Core annotation tests
        run: >-
          uv run --no-project --python 3.14 --with pytest --with numpy --with packaging
          pytest tests/integration/test_io_model.py -k "not passthrough"
        env:
          PYTHONPATH: packages/bioimageflow-core

  core-array-lifetime:
    name: Core artifact contracts and array lifetime (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12"]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.9"
      - name: Select native build or held canonical Core candidate
        id: core_candidate
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id || '' }}
          CANDIDATE_SHA256: ${{ inputs.candidate_core_sha256 || '' }}
          FLOOR_ONLY: ${{ inputs.core_floor_only || false }}
        run: |
          uv run --no-project --python 3.11 python scripts/check_core_candidate.py select \
            --run-id "$CANDIDATE_RUN_ID" --sha256 "$CANDIDATE_SHA256" \
            --event "$GITHUB_EVENT_NAME" --floor-only "$FLOOR_ONLY" --github-output "$GITHUB_OUTPUT"
      - name: Admit exact successful ordinary candidate CI run
        if: steps.core_candidate.outputs.candidate == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_SHA256: ${{ inputs.candidate_core_sha256 }}
        run: |
          uv run --no-project --python 3.11 python scripts/check_core_candidate.py run \
            --run-id "$CANDIDATE_RUN_ID" --sha256 "$CANDIDATE_SHA256" \
            --repository "$GITHUB_REPOSITORY" --source-sha "$GITHUB_SHA" \
            --source-root "$GITHUB_WORKSPACE" --receipt "$RUNNER_TEMP/core-candidate-run.json"
      - name: Download the admitted ordinary packages artifact
        if: steps.core_candidate.outputs.candidate == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/core-candidate-packages
      - name: Verify canonical Core bytes before installation
        id: candidate_wheel
        if: steps.core_candidate.outputs.candidate == 'true'
        run: |
          uv run --no-project --python 3.11 python scripts/check_core_candidate.py wheel \
            --artifacts "$RUNNER_TEMP/core-candidate-packages" \
            --run-receipt "$RUNNER_TEMP/core-candidate-run.json" --source-root "$GITHUB_WORKSPACE" \
            --receipt "$RUNNER_TEMP/core-candidate-wheel.json" --github-output "$GITHUB_OUTPUT"
      - name: Build current Core wheel without workspace sources
        if: steps.core_candidate.outputs.candidate != 'true'
        run: uv build --package bioimageflow-core --no-sources --out-dir dist/core-array-lifetime
      - name: Install normal isolated artifact closure
        env:
          CANDIDATE_WHEEL: ${{ steps.candidate_wheel.outputs.wheel }}
        run: |
          uv venv --python "${{ matrix.python }}" "$RUNNER_TEMP/core-array-runtime"
          if [ "$RUNNER_OS" = "Windows" ]; then
            runtime_python="$RUNNER_TEMP/core-array-runtime/Scripts/python.exe"
          else
            runtime_python="$RUNNER_TEMP/core-array-runtime/bin/python"
          fi
          wheel_path="${CANDIDATE_WHEEL:-$GITHUB_WORKSPACE/dist/core-array-lifetime/bioimageflow_core-0.5.0-py3-none-any.whl}"
          uv pip install --python "$runtime_python" --no-sources "$wheel_path" "numpy==1.26.4"
          uv pip check --python "$runtime_python"
          echo "CORE_ARRAY_PYTHON=$runtime_python" >> "$GITHUB_ENV"
          echo "CORE_ARRAY_WHEEL=$wheel_path" >> "$GITHUB_ENV"
      - name: Check source-disabled Core contracts and child/view/owner lifetimes
        run: |
          cp scripts/check_core_array_lifetime.py "$RUNNER_TEMP/check_core_array_lifetime.py"
          cd "$RUNNER_TEMP"
          "$CORE_ARRAY_PYTHON" -I check_core_array_lifetime.py \
            --wheel "$CORE_ARRAY_WHEEL" --source-root "$GITHUB_WORKSPACE" \
            --expected-version 0.5.0 --expected-python "${{ matrix.python }}" \
            --root "$RUNNER_TEMP/core-array-witness" --receipt "$RUNNER_TEMP/core-array-receipt.json"
      - name: Upload exact capability receipt and child evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-array-lifetime-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            ${{ runner.temp }}/core-array-receipt.json
            ${{ runner.temp }}/core-array-witness/*-child.log
            ${{ runner.temp }}/core-array-witness/*-reply.json
            ${{ runner.temp }}/core-candidate-run.json
            ${{ runner.temp }}/core-candidate-wheel.json
          if-no-files-found: warn
          retention-days: 7

  local-worker-capability:
    name: Local WorkerPool capability (editable Core, Python 3.10)
    if: github.event_name == 'workflow_dispatch' && !inputs.core_floor_only
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UV_PYTHON: "3.10"
      BIOIMAGEFLOW_CORE_SOURCE: ${{ github.workspace }}/packages/bioimageflow-core
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.9"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install workspace
        run: uv sync --locked --all-packages --group dev
      - name: Run finite real local WorkerPool owners
        run: >-
          uv run pytest --run-complete -rsx
          tests/integration/test_wetlands_smoke.py
          tests/integration/test_wetlands_task_api.py
          tests/integration/test_wetlands_cancellation.py
          packages/bioimageflow-common-tools/tests/test_common_complete_wetlands.py

  deterministic-tests:
    if: github.event_name != 'workflow_dispatch' || !inputs.core_floor_only
    name: Deterministic acceptance and package tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UV_PYTHON: "3.10"
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.9"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install workspace
        run: uv sync --locked --all-packages --group dev
      - name: Run acceptance tests
        run: uv run pytest $LOCAL_LIBRARY_PYTEST_ARGS -m "acceptance and not complete"
      - name: Run package-tool tests
        run: uv run pytest $LOCAL_LIBRARY_PYTEST_ARGS -m "package_tools and not complete"

  packages:
    if: github.event_name != 'workflow_dispatch' || !inputs.core_floor_only
    name: Build and validate packages
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UV_PYTHON: "3.10"
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.9"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install workspace
        run: uv sync --locked --all-packages --group dev
      - name: Validate package metadata
        run: uv run pytest tests/unit/test_package_artifacts.py
      - name: Build all packages without workspace sources
        run: uv build --all-packages --no-sources --out-dir dist/packages
      - name: Validate built artifacts
        env:
          BIOIMAGEFLOW_PACKAGE_ARTIFACTS_DIR: dist/packages
        run: uv run pytest tests/unit/test_package_artifacts.py
      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: |
            dist/packages/*.whl
            dist/packages/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  docs:
    if: github.event_name != 'workflow_dispatch' || !inputs.core_floor_only
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.10"
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.9"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install workspace
        run: uv sync --locked --all-packages --group dev
      - name: Check generated documentation
        run: uv run python docs/generate_tool_package_docs.py --check
      - name: Build documentation
        run: uv run sphinx-build -W --keep-going docs/source docs/_build/html
      - name: Upload documentation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentation
          path: docs/_build/html
          if-no-files-found: error
          retention-days: 7

name: Distributed CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: distributed-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
  UV_LINK_MODE: copy

jobs:
  distributed-unit-tests:
    name: Distributed unit contracts (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.9"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install workspace
        run: uv sync --locked --all-packages --group dev
      - name: Run unit tests
        run: uv run pytest tests/unit/parsl tests/unit/cluster tests/unit/launcher tests/unit/test_distributed_contract.py -m "not slow and not acceptance and not packaging and not package_tools and not complete and not wetlands and not public_data and not external_binary and not sairpico_binary and not model_runtime and not parsl"

  distributed-integration-tests:
    name: Distributed direct integration contracts (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.9"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install workspace
        run: uv sync --locked --all-packages --group dev
      - name: Run direct integration tests
        run: uv run pytest tests/integration/parsl tests/integration/launcher -m "not slow and not acceptance and not packaging and not package_tools and not complete and not wetlands and not public_data and not external_binary and not sairpico_binary and not model_runtime and not parsl"

  parsl-fast-tests:
    name: Parsl fast runtime (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.9"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install workspace
        run: uv sync --locked --all-packages --group dev
      - name: Run fast Parsl runtime tests
        run: uv run pytest tests -m "parsl and not slow"

  parsl-process-tests:
    name: Parsl process isolation (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UV_PYTHON: "3.11"
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.9"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install workspace
        run: uv sync --locked --all-packages --group dev
      - name: Run process-isolated Parsl tests
        run: uv run pytest tests -m "parsl and slow"


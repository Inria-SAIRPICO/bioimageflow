name: Publish package to PyPI

on:
  push:
    tags:
      - "bioimageflow*-v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
  UV_LINK_MODE: copy
  UV_PYTHON: "3.11"

jobs:
  build:
    name: Validate and build release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      package: ${{ steps.release.outputs.package }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.9"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install workspace
        run: uv sync --locked --all-packages --group dev
      - name: Validate release tag
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package="$(uv run python scripts/check_package_release.py "$RELEASE_TAG" --field package)"
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "RELEASE_PACKAGE=$package" >> "$GITHUB_ENV"
      - name: Ruff
        run: uv run ruff check .
      - name: Pyright
        run: uv run pyright
      - name: Run fast deterministic tests
        run: uv run pytest tests -m "not slow and not acceptance and not packaging and not package_tools and not complete and not wetlands and not public_data and not external_binary and not sairpico_binary and not model_runtime"
      - name: Run acceptance tests
        run: uv run pytest -m "acceptance and not complete"
      - name: Run package-tool tests
        run: uv run pytest -m "package_tools and not complete"
      - name: Build documentation
        run: uv run sphinx-build -W --keep-going docs/source docs/_build/html
      - name: Build selected package without workspace sources
        run: uv build --package "$RELEASE_PACKAGE" --no-sources --clear --out-dir dist/release
      - name: Validate selected package artifacts
        env:
          BIOIMAGEFLOW_PACKAGE_ARTIFACTS_DIR: dist/release
          BIOIMAGEFLOW_PACKAGE_ARTIFACTS_PACKAGE: ${{ steps.release.outputs.package }}
        run: uv run pytest tests/unit/test_package_artifacts.py
      - name: Validate release artifact identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run python scripts/check_package_release.py "$RELEASE_TAG" --artifacts-dir dist/release
      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-distributions
          path: |
            dist/release/*.whl
            dist/release/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish ${{ needs.build.outputs.package }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/${{ needs.build.outputs.package }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.9"
          enable-cache: false
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: dist/release
      - name: Publish with PyPI Trusted Publishing
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple dist/release/*

<svg xmlns="http://www.w3.org/2000/svg" width="760" height="250" viewBox="0 0 760 250" role="img" aria-label="Specialized tool workflow overview">
  <rect width="760" height="250" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" font-size="14" fill="#111827">
    <text x="40" y="38" font-size="20" font-weight="700">Specialized tool workflows</text>
    <g transform="translate(40 70)">
      <rect x="0" y="0" width="150" height="42" rx="6" fill="#dbeafe" stroke="#2563eb"/>
      <text x="18" y="26">Puncta image</text>
      <rect x="205" y="0" width="150" height="42" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
      <text x="226" y="26">DetectSpots</text>
      <rect x="410" y="0" width="150" height="42" rx="6" fill="#dcfce7" stroke="#16a34a"/>
      <text x="426" y="26">Assign/Summary</text>
      <line x1="150" y1="21" x2="205" y2="21" stroke="#64748b" stroke-width="2"/>
      <line x1="355" y1="21" x2="410" y2="21" stroke="#64748b" stroke-width="2"/>
    </g>
    <g transform="translate(40 130)">
      <rect x="0" y="0" width="150" height="42" rx="6" fill="#fef3c7" stroke="#d97706"/>
      <text x="18" y="26">Synthetic image</text>
      <rect x="205" y="0" width="150" height="42" rx="6" fill="#ffedd5" stroke="#ea580c"/>
      <text x="218" y="26">Blur + noise</text>
      <rect x="410" y="0" width="150" height="42" rx="6" fill="#fee2e2" stroke="#dc2626"/>
      <text x="430" y="26">Restore/Metrics</text>
      <line x1="150" y1="21" x2="205" y2="21" stroke="#64748b" stroke-width="2"/>
      <line x1="355" y1="21" x2="410" y2="21" stroke="#64748b" stroke-width="2"/>
    </g>
    <g transform="translate(40 190)">
      <rect x="0" y="0" width="150" height="42" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
      <text x="26" y="26">Label stack</text>
      <rect x="205" y="0" width="150" height="42" rx="6" fill="#f3e8ff" stroke="#9333ea"/>
      <text x="219" y="26">LabelsToObjects</text>
      <rect x="410" y="0" width="150" height="42" rx="6" fill="#fae8ff" stroke="#c026d3"/>
      <text x="432" y="26">Link/Metrics</text>
      <line x1="150" y1="21" x2="205" y2="21" stroke="#64748b" stroke-width="2"/>
      <line x1="355" y1="21" x2="410" y2="21" stroke="#64748b" stroke-width="2"/>
    </g>
